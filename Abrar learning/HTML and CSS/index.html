<!DOCTYPE html>
<html>
<head>
    <title>HTML Forms</title>
</head>

<body>
    <h1>HTML Forms</h1>

    <form>
        <label for="username">Enter username:</label>
        <input type="text" id="username" name=""username placeholder="Username" required>
        
        <br><br>
        
        <label for="email">Enter email:</label>
        <input type="email" id="email" name="email" placeholder="Email" required>
        
        <br><br>
        
        <label for="password">Enter password:</label>
        <input type="password" id="password" name="password" placeholder="Password" required>
        
        <br><br>
        
        <p>Select your age:</p>
        <input type="radio" id="option1" name="age" value="0-13" required>
        <label for="option1">0-13</label><br>
        <input type="radio" id="option2" name="age" value="14-18">
        <label for="option2">14-18</label><br>
        <input type="radio" id="option3" name="age" value="19-25">
        <label for="option3">19-25</label><br>
        <input type="radio" id="option4" name="age" value="26-35">
        <label for="option4">26-35</label><br>

        <br>

        <label for="">Security questions</label>
        <select name="question" id="question">
            <option value="q1">What's your favorite color?</option>
            <option value="q2">What's your favorite food?</option>
            <option value="q3">The name of your first grade teacher</option>
            <option value="q4">If you could be Ayaan, would you?</option>
            <input style="margin-left: 5px;" type="text", name="answer", id="answer", placeholder="Enter answer" required>
        </select>

        <br><br>

        <label for="bio">Why are you using this website (250 word minimum)</label>
        <br>
        <textarea name="bio" id="bio" cols="30" rows="10" placeholder="Enter answer" required></textarea>
        <br>
        <input type="submit" value="Submit">

    </form>
</body>

</html>
