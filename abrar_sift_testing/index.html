<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SIFT</title>

  </head>
  <body>
    <div class="header">
      <h1>Welcome to Sift!</h1>
    </div>

    <div class = mainBody>
      <style>

        /* Styles for navbar */
        .navbar {
          width: 250px;
          transition: width 0.3s;
          overflow: hidden;
        }

        .navbar a {
          display: inline-block;
          padding: 10px 20px;
          background-color: #007BFF;
          color: white;
          text-decoration: none;
          border-radius: 5px;
          margin: 5px;
        }
        
        .navbar a:hover {
          background-color: #0056b3;
        }

        .navbar.collapsed {
          width: 0;
          height: 0;
        }

        /* Styles for the toggle button */
        .menu-toggle {
          cursor: pointer;
          font-size: 24px;
          margin: 10px;
        }

        /* Hide the icon when the navbar is open */
        .menu-toggle.burger {
          display: none;
        }

        .navbar.collapsed ~ .menu-toggle.arrow {
          display: none;
        }

        .navbar.collapsed ~ .menu-toggle.burger {
          display: inline;
        }
      </style>
      
      <div class="navbar">
        <a href="#" onclick="navigateTo('Auto-grader')">Autograder</a>
        <a href="#" onclick="navigateTo('About')">About</a>
        <hr>
        <a href="#" onclick="navigateTo('Settings')">Settings</a>
        <a href="#" onclick="navigateTo('Shutdown')">Shutdown</a>
      </div>

      <span class="menu-toggle arrow" onclick="toggleMenu()">➤</span>
      <span class="menu-toggle burger" onclick="toggleMenu()">☰</span>
      
      <div class="mainContent">
        <h2>mainContent</h2>
        <div id="Auto-grader">
          <h2>Auto Grading page</h2>
        </div>
        <div id="About">
          <h2>About page</h2>
        </div>
        <div id="settings">
          <h2>settings page</h2>
        </div>
        


      </div>
    </div>

    <script>
      function toggleMenu() {
        const navbar = document.getElementById('navbar');
        navbar.classList.toggle('collapsed');
      }

      function navigateTo(page) {
        const pages = ['Auto-grader', 'About', 'Settings', 'Shutdown'];
        pages.forEach((p) => {
          const el = document.getElementById(p);
          if (el) {
            el.style.display = 'none';
          }
        });
        document.getElementById(page).style.display = 'block';
      }
    </script>


    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
